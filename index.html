<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>訓練日誌</title>
<meta name="theme-color" content="#F1F3F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="訓練日誌">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#F1F3F6;--card:#fff;--ink:#1B2331;--sub:#647084;--line:#DCE1E8;
  --mon:#C8365A;--tue:#2D6BDB;--wed:#1B7F5C;--thu:#A96B00;--fri:#7A55D3;
  --c:var(--mon);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1B2331;outline-offset:2px}

/* header */
.top{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0 8px}
.top h1{margin:0;font-size:22px;letter-spacing:.02em}
#status{font-size:13px;color:var(--sub)}
#status.warn{color:#B3261E;font-weight:600}
.banner{background:#FFF3D6;border:1px solid #EBCB78;color:#5B4300;border-radius:8px;padding:10px 12px;font-size:14px;margin:6px 0 10px}

/* date */
.daterow{display:grid;grid-template-columns:44px 1fr 44px auto;gap:8px;margin:6px 0 12px}
.daterow button,.daterow input{height:44px;border:1px solid var(--line);background:#fff;border-radius:8px}
.daterow input{padding:0 10px;text-align:center;min-width:0}
.daterow .today{padding:0 14px;font-weight:600}
.daterow .arrow{font-size:22px;line-height:1}

/* part selector */
.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.parts button{border:1px solid var(--line);border-top:4px solid var(--pc);background:#fff;border-radius:8px;
  padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.parts small{font-size:12px;color:var(--sub)}
.parts b{font-size:18px}
.parts button.on{background:var(--pc);color:#fff;border-color:var(--pc)}
.parts button.on small{color:rgba(255,255,255,.85)}

/* day head */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px}
.dayhead h2{margin:0;font-size:24px;color:var(--c)}
.dayhead span{font-size:14px;color:var(--sub)}
.tips{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px;margin:8px 0}
.tips summary{padding:11px 0;font-weight:600;cursor:pointer}
.tips ul{margin:0 0 10px;padding-left:20px;font-size:15px}
.tips li{margin:4px 0}
.hint{font-size:13px;color:var(--sub);margin:4px 2px 0}

/* exercise card */
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);
  border-radius:10px;padding:12px 12px 10px;margin:10px 0}
.card.done{border-left-color:var(--c);background:color-mix(in srgb,var(--c) 6%,#fff)}
.card .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3{margin:0;font-size:17px}
.card .rec{font-size:13px;color:var(--sub);white-space:nowrap}
.card .muscle{margin:2px 0 0;font-size:14px;color:var(--sub)}
.card .last{margin:6px 0 0;font-size:13px;color:var(--c);font-weight:600}
.card .last.none{color:var(--sub);font-weight:400}
.lab{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chips button{height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:17px;font-weight:600}
.chips button.sug{border:1px dashed var(--c)}
.chips button.on{background:var(--c);border:1px solid var(--c);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px}
.why{margin-top:8px;border:0;background:none;color:var(--sub);font-size:13px;padding:6px 0;text-decoration:underline}
.logic{margin:2px 0 4px;font-size:14px;color:var(--ink)}

/* log */
.entry{background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px;margin:10px 0}
.entry .h{display:flex;justify-content:space-between;align-items:baseline}
.entry h3{margin:0;font-size:17px}
.entry h3 span{color:var(--c)}
.entry ul{list-style:none;margin:8px 0;padding:0;font-size:15px}
.entry li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.entry li:last-child{border:0}
.entry li em{font-style:normal;color:var(--sub);white-space:nowrap}
.acts{display:flex;gap:8px;justify-content:flex-end}
.acts button{height:40px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:8px}
.acts .danger{color:#B3261E;border-color:#E4B4B0}
.acts .danger.sure{background:#B3261E;color:#fff;border-color:#B3261E}
.empty{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:22px 16px;margin:14px 0;color:var(--sub);text-align:center}

/* analysis */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{font-size:13px;color:var(--sub)}
.pcount{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 12px}
.pcount div{background:#fff;border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:8px;text-align:center;padding:6px 0}
.pcount b{display:block;font-size:20px}
.pcount span{font-size:12px;color:var(--sub)}
h4{margin:20px 0 6px;font-size:16px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--sub);font-weight:600}
td.n{white-space:nowrap;text-align:right}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;font-size:14px;line-height:1.5;resize:vertical}
textarea.small{min-height:90px}
.btn{height:46px;border:0;background:var(--ink);color:#fff;border-radius:8px;font-weight:600;padding:0 18px;margin-top:8px}
.savebar{width:100%;height:52px;font-size:16px;margin:18px 0 4px;background:var(--c)}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--sub);margin:6px 0}

/* nav + toast */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{height:58px;border:0;background:none;color:var(--sub);font-weight:600;font-size:15px}
.nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:90%}
@media (prefers-reduced-motion:no-preference){.card{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';

/* ---------- 菜單（工作表一，已修正） ---------- */
const PARTS=[
{id:'mon',day:'週一',short:'胸',name:'胸部',color:'--mon',
 tips:['肩胛骨「鎖死」下壓：肩膀不聳、不往前，背部夾緊固定在板凳上，力量才會由胸肌發出。',
       '手肘角度：下放時手肘不要與肩膀平齊（T 字），略向身體靠攏，與軀幹約 45–60 度。',
       '頂峰收縮：推到最上方時想像雙臂往中間擠壓胸肌，不只是把手打直。'],
 ex:[
 {id:'m1',name:'槓鈴平板握推',muscle:'胸大肌中段（厚度）',sets:4,reps:'8–12',rd:10,why:'基礎建立。體力最好時第一個做，用最大負重建立胸部整體厚度。'},
 {id:'m2',name:'上斜啞鈴臥推',muscle:'胸大肌上緣（鎖骨下方）',sets:4,reps:'10–12',rd:10,why:'視覺提拔。填滿鎖骨下方的空缺，讓上半身看起來更挺、不凹陷。'},
 {id:'m3',name:'飛鳥機夾胸',muscle:'胸肌內側（中縫線條）',sets:3,reps:'15',rd:15,why:'線條刻畫。孤立動作，純靠胸肌收縮，增加胸部的集中感與立體感。'},
 {id:'m4',name:'伏地挺身（降階）',muscle:'胸大肌整體＋核心',sets:3,reps:'力竭',rd:'F',why:'最後泵感。力氣放盡可改跪姿，把剩餘力氣榨乾。'},
 {id:'m5',name:'繩索下壓（三頭）',muscle:'肱三頭肌（手臂後側）',sets:3,reps:'12–15',rd:12,why:'順便修飾。推的動作都會用到三頭，收尾加 3 組孤立訓練。'}
 ]},
{id:'tue',day:'週二',short:'背',name:'背部',color:'--tue',
 tips:['「鉤子原則」：雙手只是鉤子，發力點在手肘，想像手肘去撞後方的牆，才不會變成二頭在出力。',
       '肩胛骨先行：每個動作開始前先做「肩胛骨下沉收攏」，背肌才能完全收縮。',
       '頂峰收縮：拉到最底（或最靠近身體）時停頓 1 秒，用力擠壓背部。'],
 ex:[
 {id:'b1',name:'槓鈴划船',muscle:'中背、斜方肌、豎脊肌',sets:4,reps:'8–10',rd:10,why:'厚度優先。體力最好時做的「大招」，建立背部整體肌肉量與厚度。'},
 {id:'b2',name:'滑輪下拉',muscle:'闊背肌',sets:4,reps:'10–12',rd:10,why:'寬度補強。建立倒三角線條，視覺上讓腰部看起來更細。'},
 {id:'b3',name:'坐姿窄握划船（V柄）',muscle:'闊背肌下部、菱形肌',sets:3,reps:'12',rd:12,why:'深度刻畫。針對背部中心線條，讓背部更有層次。'},
 {id:'b4',name:'直臂下壓',muscle:'闊背肌孤立、大圓肌',sets:3,reps:'15',rd:15,why:'預力竭／收尾。不動用二頭肌，純粹背部發力。'},
 {id:'face',name:'臉拉',muscle:'後三角肌、上背小肌群',sets:3,reps:'15–20',rd:15,why:'姿勢矯正。修飾肩膀後側，預防圓肩，讓體態更挺。'}
 ]},
{id:'wed',day:'週三',short:'腿',name:'腿部',color:'--wed',
 tips:['重心位置：深蹲和 RDL 重心壓在足中或後跟，不要墊腳尖，才能點火臀部而不是只有膝蓋受壓。',
       'RDL「推門」想像：屁股往後去撞開一扇關上的門，上半身順勢前傾，重點在後側肌肉的拉伸感。',
       '核心收緊：練腿最容易塌腰，保持核心緊繃保護下背。'],
 ex:[
 {id:'l1',name:'槓鈴深蹲',muscle:'股四頭肌（大腿前側）、臀大肌',sets:4,reps:'8–12',rd:10,why:'代謝引擎。動用全身最多肌肉，是增肌減脂效率最高的動作。'},
 {id:'l2',name:'羅馬尼亞硬舉（RDL）',muscle:'腿後腱（膕繩肌）、臀大肌',sets:4,reps:'10–12',rd:10,why:'提臀關鍵。針對大腿後側與臀部連結處，讓腿後線條更完整。'},
 {id:'l3',name:'保加利亞分腿蹲',muscle:'股四頭肌、臀大肌、臀中肌',sets:3,reps:'每側 10',rd:10,side:true,why:'修飾線條。單腿動作強迫核心出力，並雕塑臀部兩側。'},
 {id:'l4',name:'器械腿伸展',muscle:'股四頭肌（孤立）',sets:3,reps:'15',rd:15,why:'刻畫細節。疲勞時用器械補強大腿前側，關節不需大幅擺動。'},
 {id:'l5',name:'負重臀橋',muscle:'臀大肌（孤立）',sets:3,reps:'15–20',rd:15,why:'最終泵感，把臀部肌肉徹底燃燒。'}
 ]},
{id:'thu',day:'週四',short:'肩',name:'肩膀',color:'--thu',
 tips:['肩膀下沉：做側平舉或推舉時不聳肩，耳朵和肩膀保持最大距離，力量才不會跑到脖子。',
       '小重量、高次數：肩膀對高次數的灼熱感反應好，選能控制的重量做到肌肉發熱。',
       '側平舉手肘微彎（像抱大樹），高度不超過肩膀，手肘略高於手腕。'],
 ex:[
 {id:'s1',name:'啞鈴推舉（站姿／坐姿）',muscle:'前三角肌、三頭肌',sets:4,reps:'10–12',rd:10,why:'整體建構。肩膀的基礎動作，決定飽滿度與支撐力。'},
 {id:'s2',name:'啞鈴側平舉（側飛鳥）',muscle:'中三角肌（寬肩關鍵）',sets:4,reps:'15',rd:15,why:'寬度核心。變寬、修飾「直角肩」最有效的動作。'},
 {id:'s3',name:'啞鈴前平舉',muscle:'前三角肌',sets:3,reps:'12–15',rd:12,why:'線條修飾。讓肩膀正面有明顯圓弧度，與胸肌線條銜接。'},
 {id:'s4',name:'俯身啞鈴飛鳥',muscle:'後三角肌',sets:3,reps:'15',rd:15,why:'後束孤立。輕重量高次數，感受肩膀後側收縮，讓體態更挺。'},
 {id:'face',name:'臉拉',muscle:'後三角肌、上背小肌群',sets:3,reps:'15–20',rd:15,why:'姿勢矯正。繩索拉向臉部並外旋，補強後束、預防圓肩。'}
 ]},
{id:'fri',day:'週五',short:'臂核',name:'手臂與核心',color:'--fri',
 tips:['手臂：手肘像釘子釘在肋骨兩側，不晃身體，晃動就是代償，訓練效率會歸零。',
       '核心：不憋氣，想像肚臍貼往脊椎；死蟲式下背要緊貼地面，不能有縫隙。',
       '遞減組：最後一組做完後立刻換輕一半的重量再做到力竭，增加充血感。'],
 ex:[
 {id:'f1',name:'啞鈴二頭彎舉',muscle:'二頭肌（手臂前側）',sets:3,reps:'15–20',rd:15,why:'高次數充血。修飾手臂正面線條。'},
 {id:'f2',name:'錘式彎舉',muscle:'肱橈肌、二頭肌外側',sets:3,reps:'15–20',rd:15,why:'增加視覺層次。讓手臂從側面看更有型。'},
 {id:'f3',name:'死蟲式（Dead Bug）',muscle:'深層核心（腹橫肌）',sets:3,reps:'15',rd:15,why:'抗穩定訓練。四肢移動時，學習維持軀幹穩定、下背貼地。'},
 {id:'f4',name:'鳥狗式（Bird-Dog）',muscle:'核心、下背、臀部（穩定）',sets:3,reps:'15',rd:15,why:'抗旋轉穩定。對側手腳伸展時，骨盆與軀幹不晃動。'},
 {id:'f5',name:'俄羅斯轉體',muscle:'腹斜肌（腰側）',sets:3,reps:'每側 12',rd:12,side:true,why:'腰部線條刻畫。增加腹部側邊的緊實度。'},
 {id:'f6',name:'反向捲腹',muscle:'下腹部（腹直肌下段）',sets:3,reps:'15',rd:15,why:'針對腹部下段的弱項補強。'},
 {id:'f7',name:'空中腳踏車',muscle:'腹斜肌、腹直肌',sets:3,reps:'30',rd:30,why:'腰部線條刻畫。增加腹部側邊的緊實度。'}
 ]}
];

/* ---------- 選項 ---------- */
const REPS=[];for(let i=1;i<=40;i++)REPS.push({v:i,t:i+' 次'});REPS.push({v:'F',t:'力竭'});
const KG=[{v:0,t:'自重（0 kg）'}];
for(let v=0.5;v<=20;v+=0.5)KG.push({v:v,t:v+' kg'});
for(let v=21;v<=60;v++)KG.push({v:v,t:v+' kg'});
for(let v=62.5;v<=200;v+=2.5)KG.push({v:v,t:v+' kg'});

/* ---------- 狀態 ---------- */
const KEY='workout-logs-v1';
const WD=['日','一','二','三','四','五','六'];
const state={view:'train',part:'mon',date:ds(new Date()),logs:{},open:{},del:null,month:null,tipsOpen:false};
let hasStore=false;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');hasStore=true;}catch(e){hasStore=false;}
const app=document.getElementById('app');

function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function partOf(id){return PARTS.find(p=>p.id===id)}
function autoPart(){const d=pd(state.date).getDay();if(d>=1&&d<=5)state.part=PARTS[d-1].id}
function repLabel(r){return r===null||r===undefined?'次數未填':(r==='F'?'力竭':r+' 次')}
function kgLabel(k){return k===null||k===undefined?'公斤未填':(k===0?'自重':k+' kg')}
function fmtItem(ex,it){return it.s+' 組 × '+repLabel(it.r)+(ex.side?'（每側）':'')}

/* ---------- 儲存 ---------- */
async function loadAll(){
  if(!hasStore)return;
  try{const v=localStorage.getItem(KEY);if(v)state.logs=JSON.parse(v)||{};}
  catch(e){/* 沒有資料或格式錯誤 */}
}
let saveTimer=null;
function persist(){
  setStatus('儲存中…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,250);
}
async function saveNow(){
  if(!hasStore){setStatus('未自動保存，請定期備份',true);return}
  try{localStorage.setItem(KEY,JSON.stringify(state.logs));setStatus('已儲存 ✓');}
  catch(e){hasStore=false;setStatus('無法保存，請備份',true)}
}
function setStatus(t,warn){const el=document.getElementById('status');if(el){el.textContent=t;el.className=warn?'warn':''}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

/* ---------- 資料存取 ---------- */
function getItem(d,p,id){return state.logs[d]&&state.logs[d][p]&&state.logs[d][p][id]}
function setItem(d,p,id,it){
  if(!state.logs[d])state.logs[d]={};
  if(!state.logs[d][p])state.logs[d][p]={};
  state.logs[d][p][id]=it;
}
function delItem(d,p,id){
  if(!state.logs[d]||!state.logs[d][p])return;
  delete state.logs[d][p][id];
  if(!Object.keys(state.logs[d][p]).length)delete state.logs[d][p];
  if(!Object.keys(state.logs[d]).length)delete state.logs[d];
}
function lastOf(id,before){
  let best=null;
  Object.keys(state.logs).forEach(d=>{
    if(d>=before)return;
    Object.keys(state.logs[d]).forEach(p=>{
      const it=state.logs[d][p][id];
      if(it&&it.s&&(!best||d>best.d))best={d:d,s:it.s,r:it.r,k:it.k};
    });
  });
  return best;
}
function findEx(id){return partOf(state.part).ex.find(e=>e.id===id)}
function md(d){const x=pd(d);return (x.getMonth()+1)+'/'+x.getDate()}

/* ---------- 畫面：共用 ---------- */
function header(){
  return '<div class="top"><h1>訓練日誌</h1><span id="status">'+(hasStore?'':'未自動保存')+'</span></div>';
}
function nav(){
  const items=[['train','訓練'],['log','紀錄'],['analysis','分析']];
  return '<nav class="nav">'+items.map(i=>'<button data-act="view" data-v="'+i[0]+'" class="'+(state.view===i[0]?'on':'')+'">'+i[1]+'</button>').join('')+'</nav>';
}

/* ---------- 畫面：訓練 ---------- */
function opts(list,cur,ph){
  return '<option value=""'+(cur===null||cur===undefined?' selected':'')+'>'+ph+'</option>'+
    list.map(o=>'<option value="'+o.v+'"'+(String(o.v)===String(cur)?' selected':'')+'>'+o.t+'</option>').join('');
}
function cardHTML(ex){
  const it=getItem(state.date,state.part,ex.id);
  const last=lastOf(ex.id,state.date);
  const s=it?it.s:0;
  const chips=[1,2,3,4,5,6].map(n=>'<button data-act="sets" data-ex="'+ex.id+'" data-n="'+n+'" aria-pressed="'+(s===n)+'" class="'+(s===n?'on':(n===ex.sets?'sug':''))+'">'+n+'</button>').join('');
  const lastTxt=last?'上次 '+md(last.d)+'：'+fmtItem(ex,last)+' · '+kgLabel(last.k):'還沒有這個動作的紀錄';
  return '<article class="card'+(s?' done':'')+'" data-card="'+ex.id+'">'+
    '<div class="h"><h3>'+ex.name+'</h3><span class="rec">建議 '+ex.sets+' 組 × '+ex.reps+'</span></div>'+
    '<p class="muscle">'+ex.muscle+'</p>'+
    '<p class="last'+(last?'':' none')+'">'+lastTxt+'</p>'+
    '<span class="lab">完成組數（虛線 = 建議組數，再點一次可取消）</span><div class="chips">'+chips+'</div>'+
    '<div class="two"><div><span class="lab">每組次數'+(ex.side?'（每側）':'')+'</span><select data-f="r" data-ex="'+ex.id+'" aria-label="每組次數">'+opts(REPS,it?it.r:null,'選次數')+'</select></div>'+
    '<div><span class="lab">公斤</span><select data-f="k" data-ex="'+ex.id+'" aria-label="公斤">'+opts(KG,it?it.k:null,'選公斤')+'</select></div></div>'+
    '<button class="why" data-act="why" data-ex="'+ex.id+'">'+(state.open[ex.id]?'收起說明':'為什麼這樣排')+'</button>'+
    (state.open[ex.id]?'<p class="logic">'+ex.why+'</p>':'')+
    '</article>';
}
function progText(){
  const P=partOf(state.part);
  const n=P.ex.filter(e=>{const it=getItem(state.date,P.id,e.id);return it&&it.s}).length;
  return '已記 '+n+' / '+P.ex.length+' 項';
}
function trainView(){
  const P=partOf(state.part);
  const dow=pd(state.date).getDay();
  const parts=PARTS.map(p=>'<button data-act="part" data-p="'+p.id+'" style="--pc:var('+p.color+')" class="'+(p.id===state.part?'on':'')+'" aria-pressed="'+(p.id===state.part)+'"><small>'+p.day+'</small><b>'+p.short+'</b></button>').join('');
  return '<main style="--c:var('+P.color+')">'+
    (hasStore?'':'<div class="banner">此環境無法自動保存。訓練完後到「分析」複製備份，下次再貼回還原。</div>')+
    '<div class="daterow"><button class="arrow" data-act="prev" aria-label="前一天">‹</button>'+
    '<input type="date" id="date" value="'+state.date+'" aria-label="訓練日期"><button class="arrow" data-act="next" aria-label="後一天">›</button>'+
    '<button class="today" data-act="today">今天</button></div>'+
    '<div class="parts">'+parts+'</div>'+
    '<div class="dayhead"><h2>'+P.day+'　'+P.name+'</h2><span id="prog">'+progText()+'</span></div>'+
    '<details class="tips"'+(state.tipsOpen?' open':'')+'><summary>動作要點</summary><ul>'+P.tips.map(t=>'<li>'+t+'</li>').join('')+'</ul></details>'+
    '<p class="hint">啞鈴填單手重量，槓鈴填總重（含槓）；自重動作選 0。點組數或選次數、公斤後會自動儲存，也可以練完按下方按鈕再存一次確認。'+(dow===0||dow===6?'（今天是週末，可自行選部位補練）':'')+'</p>'+
    P.ex.map(cardHTML).join('')+
    '<button class="btn savebar" data-act="savetoday">儲存今日紀錄</button>'+
    '</main>';
}
function refreshCard(id){
  const ex=findEx(id);const el=app.querySelector('[data-card="'+id+'"]');
  if(!ex||!el)return;
  el.outerHTML=cardHTML(ex);
  const pg=document.getElementById('prog');if(pg)pg.textContent=progText();
}

/* ---------- 畫面：紀錄 ---------- */
function logView(){
  const dates=Object.keys(state.logs).sort().reverse();
  let html='<main>';
  if(!dates.length){
    html+='<div class="empty">還沒有紀錄。<br>到「訓練」選一個部位，點組數就會自動記下。</div>';
  }
  dates.forEach(d=>{
    PARTS.forEach(P=>{
      const day=state.logs[d][P.id];if(!day)return;
      const rows=P.ex.filter(e=>day[e.id]&&day[e.id].s).map(e=>{const it=day[e.id];return '<li><span>'+e.name+'</span><em>'+fmtItem(e,it)+' · '+kgLabel(it.k)+'</em></li>'});
      if(!rows.length)return;
      const key=d+'|'+P.id;const sure=state.del===key;
      html+='<section class="entry" style="--c:var('+P.color+')"><div class="h"><h3>'+md(d)+'（週'+WD[pd(d).getDay()]+'）<span>'+P.name+'</span></h3></div>'+
        '<ul>'+rows.join('')+'</ul><div class="acts">'+
        '<button data-act="edit" data-d="'+d+'" data-p="'+P.id+'">編輯</button>'+
        '<button class="danger'+(sure?' sure':'')+'" data-act="del" data-d="'+d+'" data-p="'+P.id+'">'+(sure?'確定刪除':'刪除')+'</button></div></section>';
    });
  });
  return html+'</main>';
}

/* ---------- 畫面：分析 ---------- */
function monthsList(){
  const set={};set[ds(new Date()).slice(0,7)]=1;
  Object.keys(state.logs).forEach(d=>set[d.slice(0,7)]=1);
  return Object.keys(set).sort().reverse();
}
function monthLabel(m){const a=m.split('-');return a[0]+' 年 '+Number(a[1])+' 月'}
function monthData(m){
  const dates=Object.keys(state.logs).filter(d=>d.startsWith(m)).sort();
  const perPart={};PARTS.forEach(p=>perPart[p.id]=0);
  let totalSets=0;const hist={};const days={};
  dates.forEach(d=>{
    PARTS.forEach(P=>{
      const day=state.logs[d][P.id];if(!day)return;
      let any=false;
      P.ex.forEach(e=>{
        const it=day[e.id];if(!it||!it.s)return;
        any=true;totalSets+=it.s;
        (hist[e.name]=hist[e.name]||[]).push({d:d,k:it.k,s:it.s});
      });
      if(any){perPart[P.id]++;days[d]=1;}
    });
  });
  return {dates:dates,perPart:perPart,totalSets:totalSets,hist:hist,dayCount:Object.keys(days).length};
}
function progressRows(m){
  const D=monthData(m);const rows=[];
  Object.keys(D.hist).forEach(name=>{
    const a=D.hist[name];
    const w=a.filter(x=>typeof x.k==='number'&&x.k>0);
    rows.push({name:name,n:a.length,first:w.length?w[0].k:null,last:w.length?w[w.length-1].k:null,max:w.length?Math.max.apply(null,w.map(x=>x.k)):null});
  });
  return rows;
}
function monthText(m){
  const D=monthData(m);
  const L=[];
  L.push('【訓練紀錄 '+monthLabel(m)+'】請幫我整理這個月的訓練狀況，並指出可以調整的地方。');
  L.push('菜單：週一胸／週二背／週三腿／週四肩／週五手臂＋核心（五天分化）');
  L.push('本月訓練 '+D.dayCount+' 天，總組數 '+D.totalSets+' 組；各部位天數：'+PARTS.map(p=>p.short+' '+D.perPart[p.id]).join('、'));
  L.push('格式：動作 組數×每組次數 @公斤（啞鈴為單手重量，槓鈴為總重）');
  L.push('');
  D.dates.forEach(d=>{
    PARTS.forEach(P=>{
      const day=state.logs[d][P.id];if(!day)return;
      const rows=P.ex.filter(e=>day[e.id]&&day[e.id].s);
      if(!rows.length)return;
      L.push(md(d)+'（週'+WD[pd(d).getDay()]+'）'+P.name);
      rows.forEach(e=>{
        const it=day[e.id];
        const r=it.r===null||it.r===undefined?'?':(it.r==='F'?'力竭':it.r+'次');
        const k=it.k===null||it.k===undefined?'公斤未填':(it.k===0?'自重':'@'+it.k+'kg');
        L.push('- '+e.name+' '+it.s+'組×'+r+(e.side?'(每側)':'')+' '+k);
      });
    });
  });
  const pr=progressRows(m).filter(r=>r.max!==null);
  if(pr.length){
    L.push('');L.push('重量變化（本月第一次 → 最近一次）：');
    pr.forEach(r=>L.push('- '+r.name+'：'+r.first+'kg → '+r.last+'kg（最高 '+r.max+'kg，共練 '+r.n+' 次）'));
  }
  return L.join('\n');
}
function analysisView(){
  const months=monthsList();
  if(!state.month||months.indexOf(state.month)<0)state.month=months[0];
  const m=state.month;const D=monthData(m);
  const sel='<select id="month" aria-label="選擇月份">'+months.map(x=>'<option value="'+x+'"'+(x===m?' selected':'')+'>'+monthLabel(x)+'</option>').join('')+'</select>';
  let body='';
  if(!D.dayCount){
    body='<div class="empty">這個月還沒有紀錄。</div>';
  }else{
    const rows=progressRows(m);
    body='<div class="stats"><div class="stat"><b>'+D.dayCount+'</b><span>訓練天數</span></div><div class="stat"><b>'+D.totalSets+'</b><span>總組數</span></div></div>'+
      '<div class="pcount">'+PARTS.map(p=>'<div style="--pc:var('+p.color+')"><b>'+D.perPart[p.id]+'</b><span>'+p.short+'</span></div>').join('')+'</div>'+
      '<h4>各動作重量變化</h4><table><thead><tr><th>動作</th><th class="n">次數</th><th class="n">首次</th><th class="n">最近</th><th class="n">最高</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td>'+r.name+'</td><td class="n">'+r.n+'</td><td class="n">'+(r.first===null?'—':r.first)+'</td><td class="n">'+(r.last===null?'—':r.last)+'</td><td class="n">'+(r.max===null?'—':r.max)+'</td></tr>').join('')+
      '</tbody></table>'+
      '<h4>貼給 Claude 分析</h4><textarea id="mtext" readonly>'+monthText(m)+'</textarea>'+
      '<div class="btnrow"><button class="btn" data-act="copym">複製這段文字</button></div>'+
      '<p class="note">月底複製上面整段，貼到新的對話，Claude 就能幫你整理狀況與調整建議。</p>';
  }
  return '<main><div class="dayhead" style="--c:var(--ink)"><h2 style="color:var(--ink)">月度分析</h2></div>'+sel+body+
    '<h4>備份與還原</h4>'+
    (hasStore?'':'<div class="banner">此環境不會自動保存，請養成每次訓練後備份的習慣。</div>')+
    '<p class="note">備份會包含全部月份的紀錄。換裝置或資料不見時，把備份貼到下方即可還原（會與現有資料合併）。</p>'+
    '<div class="btnrow"><button class="btn alt" data-act="copyb">複製全部備份</button></div>'+
    '<textarea id="imp" class="small" placeholder="把備份貼在這裡" style="margin-top:10px"></textarea>'+
    '<div class="btnrow"><button class="btn" data-act="import">還原</button></div></main>';
}

/* ---------- 渲染 ---------- */
function render(){
  app.innerHTML=header()+(state.view==='train'?trainView():state.view==='log'?logView():analysisView())+nav();
  if(state.view==='train'&&!hasStore)setStatus('未自動保存',true);
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();let ok=false;
    try{ok=document.execCommand('copy')}catch(_){}
    ta.remove();return ok;
  }
}

/* ---------- 事件 ---------- */
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='view'){state.view=b.dataset.v;state.del=null;render();window.scrollTo(0,0);}
  else if(a==='part'){state.part=b.dataset.p;render();}
  else if(a==='prev'||a==='next'){const d=pd(state.date);d.setDate(d.getDate()+(a==='next'?1:-1));state.date=ds(d);autoPart();render();}
  else if(a==='today'){state.date=ds(new Date());autoPart();render();}
  else if(a==='sets'){
    const ex=findEx(b.dataset.ex);const n=Number(b.dataset.n);
    const it=getItem(state.date,state.part,ex.id);
    if(it&&it.s===n){delItem(state.date,state.part,ex.id);}
    else if(it){it.s=n;}
    else{const last=lastOf(ex.id,state.date);setItem(state.date,state.part,ex.id,{s:n,r:last?last.r:ex.rd,k:last?last.k:null});}
    persist();refreshCard(ex.id);
  }
  else if(a==='savetoday'){
    clearTimeout(saveTimer);
    await saveNow();
    const P=partOf(state.part);
    const n=P.ex.filter(x=>{const it=getItem(state.date,P.id,x.id);return it&&it.s}).length;
    toast(n?'已儲存今天 '+P.name+' '+n+' 項':'今天還沒有記錄任何一項');
  }
  else if(a==='why'){state.open[b.dataset.ex]=!state.open[b.dataset.ex];refreshCard(b.dataset.ex);}
  else if(a==='edit'){state.date=b.dataset.d;state.part=b.dataset.p;state.view='train';render();window.scrollTo(0,0);}
  else if(a==='del'){
    const key=b.dataset.d+'|'+b.dataset.p;
    if(state.del===key){
      const P=partOf(b.dataset.p);
      P.ex.forEach(x=>delItem(b.dataset.d,b.dataset.p,x.id));
      state.del=null;persist();render();toast('已刪除');
    }else{state.del=key;render();}
  }
  else if(a==='copym'){const t=document.getElementById('mtext');const ok=await copyText(t.value);if(!ok){t.removeAttribute('readonly');t.focus();t.select();}toast(ok?'已複製，貼給 Claude 就可以了':'請長按全選後手動複製');}
  else if(a==='copyb'){const ok=await copyText(JSON.stringify({version:1,logs:state.logs}));toast(ok?'已複製全部備份':'複製失敗，請再試一次');}
  else if(a==='import'){
    const raw=document.getElementById('imp').value.trim();
    if(!raw){toast('請先貼上備份內容');return}
    try{
      const obj=JSON.parse(raw);const src=obj&&obj.logs?obj.logs:obj;let n=0;
      Object.keys(src).forEach(d=>{
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||typeof src[d]!=='object')return;
        Object.keys(src[d]).forEach(p=>{
          if(!partOf(p))return;
          Object.keys(src[d][p]).forEach(id=>{const it=src[d][p][id];if(it&&typeof it.s==='number')setItem(d,p,id,{s:it.s,r:it.r===undefined?null:it.r,k:it.k===undefined?null:it.k});});
        });
        n++;
      });
      persist();render();toast('已還原 '+n+' 天的紀錄');
    }catch(err){toast('備份格式不正確，請確認完整貼上');}
  }
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){
    const ex=findEx(t.dataset.ex);
    let it=getItem(state.date,state.part,ex.id);
    if(!it){const last=lastOf(ex.id,state.date);it={s:0,r:last?last.r:ex.rd,k:last?last.k:null};setItem(state.date,state.part,ex.id,it);}
    if(t.dataset.f==='r')it.r=t.value===''?null:(t.value==='F'?'F':Number(t.value));
    else it.k=t.value===''?null:Number(t.value);
    if(!it.s)it.s=ex.sets;
    persist();refreshCard(ex.id);
  }else if(t.id==='date'){
    if(t.value){state.date=t.value;autoPart();render();}
  }else if(t.id==='month'){
    state.month=t.value;render();
  }
});
app.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('tips'))state.tipsOpen=e.target.open;},true);

/* ---------- 啟動 ---------- */
if('serviceWorker' in navigator){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}});}
autoPart();
render();
loadAll().then(()=>{render();if(hasStore)setStatus('');});
})();
</script>
</body>
</html>
